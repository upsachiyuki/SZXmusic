[package]
name = "bili-api"
version = "0.2.0"
edition = "2021"

[dependencies]
flate2 = "1"
md-5 = "0.10"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

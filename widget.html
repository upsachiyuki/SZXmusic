<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SZXmusic Widget</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("szxmusic-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="szx-body-widget">
    <div id="root"></div>
    <script type="module" src="/src/widget/main.tsx"></script>
  </body>
</html>
